plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Version lives in version.properties at the repo root so a release is a
// one-file bump; versionCode is derived from it and always increases.
def versionProps = new Properties()
file("$rootDir/version.properties").withInputStream { versionProps.load(it) }
def versionMajor = versionProps.getProperty('versionMajor').toInteger()
def versionMinor = versionProps.getProperty('versionMinor').toInteger()
def versionPatch = versionProps.getProperty('versionPatch').toInteger()

// Optional release signing. Set these environment variables (the release
// workflow fills them from repository secrets) to get a properly signed,
// upgradable release APK; without them the release build stays unsigned and
// the debug-signed APK is what gets shipped.
def releaseKeystore = System.getenv('EARLLNCAM_KEYSTORE_FILE')

android {
    namespace 'com.example.earllncam'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.earllncam"
        minSdk 29
        targetSdk 34
        versionCode versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('EARLLNCAM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('EARLLNCAM_KEY_ALIAS')
                keyPassword System.getenv('EARLLNCAM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        // Lets the app read its own versionName back out of BuildConfig.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Lifecycle / coroutines
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-video:$camerax_version"
}
