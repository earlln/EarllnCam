# Single source of truth for the EarllnCam app version.
#
# Bump these values (and add a matching CHANGELOG.md entry) to release a new
# version; app/build.gradle derives versionName ("major.minor.patch") and
# versionCode (major * 10000 + minor * 100 + patch) from them, and the app
# shows the result on screen as "EarllnCam v<versionName> by Earlln.com".
versionMajor=1
versionMinor=3
versionPatch=1
